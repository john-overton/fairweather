# Fairweather: paste inside the server { } block of the site that should host /fairweather.
# Proxies to the Next.js service on 127.0.0.1:3100 (deploy/fairweather.service).
# Cron endpoints are only for the local crontab, which calls 127.0.0.1:3100 directly.

location ^~ /fairweather/api/cron/ { return 404; }
location ^~ /fairweather {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
